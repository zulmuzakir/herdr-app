name: build-intel-mac

on:
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  # Lowest macOS the binary should load on. Set to your Mac's version or lower.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Runs cargo build --release, builds ~/Applications/Herdr.app, ad-hoc signs it.
      - name: Build and bundle
        run: bash scripts/install-macos
      - name: Check target
        run: |
          file "$HOME/Applications/Herdr.app/Contents/MacOS/Herdr"
          otool -l "$HOME/Applications/Herdr.app/Contents/MacOS/Herdr" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN'
      - name: Zip app
        run: ditto -c -k --keepParent "$HOME/Applications/Herdr.app" Herdr-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Herdr-intel-mac
          path: Herdr-intel.zip
