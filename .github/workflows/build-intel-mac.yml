name: build-intel-mac

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  # Matches Ghostty's own floor (vendor/ghostty/src/build/Config.zig osVersionMin).
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    # Last free Intel macOS label; GitHub retires it around August 2027.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      # Same pinned actions as upstream ci.yml (Node 24 releases).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Runs cargo build --release, builds ~/Applications/Herdr.app, ad-hoc signs it.
      - name: Build and bundle
        run: bash scripts/install-macos
      - name: Check architecture and minimum macOS
        run: |
          bin="$HOME/Applications/Herdr.app/Contents/MacOS/Herdr"
          [ "$(lipo -archs "$bin")" = x86_64 ] || { lipo -archs "$bin"; exit 1; }
          otool -l "$bin" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN'
      - name: Zip app
        run: ditto -c -k --keepParent "$HOME/Applications/Herdr.app" Herdr-intel.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Herdr-intel-mac
          path: Herdr-intel.zip
          if-no-files-found: error
